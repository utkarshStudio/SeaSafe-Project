<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- Ship Hull Shadow -->
  <path d="M32 2 C38 18 43 28 43 48 C43 56 38 60 32 60 C26 60 21 56 21 48 C21 28 26 18 32 2 Z" fill="#0f172a" opacity="0.15" transform="translate(1, 1)" />
  
  <!-- Ship Hull Outer Outline -->
  <path d="M32 3 C38 18 42.5 28 42.5 48 C42.5 55.5 37.5 59.5 32 59.5 C26.5 59.5 21.5 55.5 21.5 48 C21.5 28 26 18 32 3 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Inside Inner Trim (Deck Line) -->
  <path d="M32 6 C36.5 19 40.5 28 40.5 47 C40.5 54 36.5 57.5 32 57.5 C27.5 57.5 23.5 54 23.5 47 C23.5 28 27.5 19 32 6 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
  
  <!-- Bow Anchor Lines -->
  <path d="M30 11 L32 7 L34 11" fill="none" stroke="#475569" stroke-width="1" />
  
  <!-- Container Blocks (Colored Cargo) -->
  <!-- Row 1 -->
  <rect x="26" y="16" width="5" height="8" fill="#0ea5e9" stroke="#0f172a" stroke-width="1" rx="0.5" />
  <rect x="33" y="16" width="5" height="8" fill="#f97316" stroke="#0f172a" stroke-width="1" rx="0.5" />
  
  <!-- Row 2 -->
  <rect x="25.5" y="26" width="6" height="8" fill="#10b981" stroke="#0f172a" stroke-width="1" rx="0.5" />
  <rect x="32.5" y="26" width="6" height="8" fill="#ec4899" stroke="#0f172a" stroke-width="1" rx="0.5" />
  
  <!-- Row 3 -->
  <rect x="25.5" y="36" width="6" height="8" fill="#ef4444" stroke="#0f172a" stroke-width="1" rx="0.5" />
  <rect x="32.5" y="36" width="6" height="8" fill="#8b5cf6" stroke="#0f172a" stroke-width="1" rx="0.5" />
  
  <!-- Bridge/Cabin Superstructure -->
  <path d="M25 46 L39 46 L37 53 L27 53 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
  <!-- Bridge Windows -->
  <rect x="28" y="48" width="8" height="2" fill="#0f172a" />
  <!-- Funnel / Exhaust -->
